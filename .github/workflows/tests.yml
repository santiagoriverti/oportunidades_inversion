name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # la misma versión que Google Colab
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Tests (datos sintéticos, sin red)
        run: python -m pytest
